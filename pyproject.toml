[project]
name = "llm-serving-benchmark"
version = "0.1.0"
description = "One model, many configs, real measured TTFT/TPOT/goodput under load, with a written tradeoff analysis and a config recommendation per SLO."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
